# Run with prek (https://github.com/j178/prek); also compatible with pre-commit.
#   prek install            # once per clone
#   prek run --all-files    # what CI runs
# Python tools (ruff, ty) run through `uv run` so versions come from uv.lock.
repos:
  - repo: builtin
    hooks:
      - id: trailing-whitespace
        exclude: \.md$
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files

  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        language: system
        entry: uv run ruff check --fix --exit-non-zero-on-fix
        types_or: [python, pyi]
      - id: ruff-format
        name: ruff format
        language: system
        entry: uv run ruff format
        types_or: [python, pyi]
      # Shipped translations are generated from translations_src; regenerating
      # modifies files, so the hook fails once and passes on re-run (like a formatter).
      - id: translations
        name: regenerate translations
        language: system
        entry: uv run python scripts/generate_translations.py
        files: ^(translations_src/|scripts/generate_translations\.py$)
        pass_filenames: false

  - repo: https://github.com/adhtruong/mirrors-typos
    rev: v1.52.2
    hooks:
      - id: typos
        # Report only: never auto-rewrite (it mangles Norwegian and `hass`).
        args: [--force-exclude]

  - repo: https://github.com/Mateusz-Grzelinski/actionlint-py
    rev: v1.7.12.25
    hooks:
      - id: actionlint

  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: v1.32.0
    hooks:
      - id: zizmor
