[project]
name = "ha-feels-like"
version = "0.1.0"
description = "Home Assistant helper that calculates a 'feels like' temperature."
readme = "README.md"
license = "MIT"
# Dev environment only: current Home Assistant (and so pytest-homeassistant-custom-component)
# requires >=3.14.2. The integration itself still targets py313 (see ruff / ty config).
requires-python = ">=3.14.2"
# Keep in sync with custom_components/feels_like/manifest.json "requirements".
dependencies = ["thermofeel==2.3.0"]

[dependency-groups]
dev = [
    "pytest-homeassistant-custom-component",
    "pytest-cov",
    "hypothesis",
    "ruff",
    "ty==0.0.104",
    "prek>=0.5.11",
]

[tool.uv]
# This is a Home Assistant custom component, not an installable package.
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--cov=custom_components.feels_like",
    "--cov-branch",
    "--cov-fail-under=93",
    "--cov-report=term-missing:skip-covered",
]
xfail_strict = true
filterwarnings = ["error"]

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = [
    "E", "F", "I", "B", "UP", "SIM",
    "ASYNC",  # blocking calls in async code
    "C4",     # comprehensions
    "PT",     # pytest style
    "RUF",
    "PERF",
    "PIE",
    "RET",
    "ARG",    # unused arguments
    "PGH",
    "T20",    # stray print/pprint
    "FURB",
    "S",      # bandit
    "PLE", "PLW",
]
ignore = [
    # Physics docstrings intentionally use Greek symbols (σ, α, γ).
    "RUF001", "RUF002", "RUF003",
]

[tool.ruff.lint.per-file-ignores]
# Asserts after `_state_value()` only narrow `state` for the type checker.
"custom_components/feels_like/coordinator.py" = ["S101"]
"tests/**" = ["S101", "S603", "ARG"]
"scripts/**" = ["T20"]

[tool.ty.environment]
# Lowest Python the integration supports (hacs.json min HA 2025.6 -> 3.13).
python-version = "3.13"

[tool.ty.src]
include = ["custom_components", "scripts", "tests"]

# Home Assistant typing quirks (decorator-registered selector classes, metaclass
# cached properties, SchemaFlowFormStep callable signature) that ty cannot model.
[[tool.ty.overrides]]
include = ["custom_components/feels_like/config_flow.py"]
[tool.ty.overrides.rules]
invalid-type-form = "ignore"
invalid-argument-type = "ignore"

[[tool.ty.overrides]]
include = ["custom_components/feels_like/sensor.py"]
[tool.ty.overrides.rules]
incompatible-property-override = "ignore"

[tool.typos.default.extend-words]
hass = "hass"  # Home Assistant's core object

[tool.typos.files]
# Norwegian text: typos only knows English.
extend-exclude = [
    "translations_src/nb.json",
    "custom_components/feels_like/translations/nb.json",
]
